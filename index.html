<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rock Is Moving</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>The Rock Is Moving</h1>
  <p>CCT 360 - Lab 3: Photo Carousel</p>
  <p>Same three pictures. Two different stories.</p>

  <div>
    <button id="story1Button" type="button">Story 1: Moving in</button>
    <button id="story2Button" type="button">Story 2: Moving out</button>
  </div>

  <div aria-live="polite">
    <h2 id="storyTitle">Story 1: Moving in</h2>
    <p id="step">Beginning - 1 / 3</p>
    <img id="photo" src="outside.png" alt="The rock sitting outside on a concrete path">
    <p id="caption">The rock waited outside for 300 years.</p>
  </div>

  <div>
    <button id="previousButton" type="button" disabled>Previous</button>
    <button id="nextButton" type="button">Next</button>
  </div>

  <p id="credit">Scene images generated using AI.<br>Rock reference: LPup / <a href="https://purepng.com/photo/13787/nature-stones-and-rocks">PurePNG</a> (CC0)</p>
  <script src="script.js"></script>
</body>
</html>
